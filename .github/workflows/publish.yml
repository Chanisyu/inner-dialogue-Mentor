name: 验证与发布 npm 包

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'package.json'
      - 'bin/**'
      - 'cli/**'
      - 'personas/**'
      - 'modalities/**'
      - 'structures/**'
      - 'hooks/**'
      - 'evals/**'
      - 'safety-protocol.md'
      - 'commands.md'
      - 'CLAUDE.template.md'
      - 'profile.template.md'
      - 'claude-settings.template.json'
      - 'manifest.json'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: 检查包版本与标签一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
      - name: 运行单元测试
        run: npm test
      - name: 运行评测回归检查
        run: npm run test:evals
      # 中文匹配与原英文门禁分别运行，防止翻译导致其中一种语言的覆盖退化。
      - name: 运行中文安全匹配检查
        run: npm run test:zh-safety
      - name: 检查 CLI 安装、诊断与更新预览
        run: |
          node bin/inner-dialogue.js --version
          node bin/inner-dialogue.js --help > /dev/null
          node bin/inner-dialogue.js install \
            --name CITest --path "$RUNNER_TEMP/ci-test" \
            --persona warm-4o --structure moderate \
            --modalities cbt --json
          node bin/inner-dialogue.js doctor --path "$RUNNER_TEMP/ci-test" --json
          node bin/inner-dialogue.js update --path "$RUNNER_TEMP/ci-test" --dry-run --json
      - name: 预览 npm 打包内容
        run: npm pack --dry-run

  publish:
    needs: smoke-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      # Trusted Publishing 的纯 OIDC 发布要求 npm 11.5.1 或更新版本。
      # 此 Node 20 环境固定使用 npm 11，避免安装要求更高 Node 版本的主版本。
      - run: npm install -g npm@11
      - run: npm publish --provenance --access public
